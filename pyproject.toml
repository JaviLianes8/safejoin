[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safejoin"
version = "0.2.0"
description = "Path-traversal-safe joining of a trusted base directory with untrusted relative parts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["path traversal", "zip slip", "safe join", "security", "symlink", "archive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Filesystems",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
safejoin = "safejoin._cli:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine"]

[project.urls]
Homepage = "https://lianes8studio.com"
Repository = "https://github.com/JaviLianes8/safejoin"
Issues = "https://github.com/JaviLianes8/safejoin/issues"
Changelog = "https://github.com/JaviLianes8/safejoin/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.wheel]
packages = ["src/safejoin"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
